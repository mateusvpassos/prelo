<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Prelo Designer (dev)</title>
<link rel="stylesheet" href="../prelo-intellij/src/main/resources/designer/designer.css">
<script src="../prelo-intellij/src/main/resources/designer/icons.js"></script>
<script>
  // host simulado: guarda as mensagens enviadas e responde ao 'ready' com o exemplo de vendas
  window.sent = [];
  window.preloMockHost = async (msg) => {
    window.sent.push(msg);
    if (msg.type === 'ready') {
      if (new URLSearchParams(location.search).get('dark') !== '0') window.prelo.receive({ type: 'theme', dark: true });
      const file = new URLSearchParams(location.search).get('file') || 'vendas';
      const [json, schema] = await Promise.all([
        fetch('../examples/' + file + '.report.json').then((r) => r.text()),
        fetch('../prelo-core/src/main/resources/prelo.schema.json').then((r) => r.text()),
      ]);
      const clean = json.replace(/^\s*\/\/.*$/gm, '');
      window.prelo.receive({ type: 'load', json: clean, schema, fileName: file + '.report.json' });
    }
    if (msg.type === 'preview') window.prelo.receive({ type: 'preview', pages: [], total: 0, notes: ['(host simulado: sem PDF)'] });
    if (msg.type === 'findClasses') window.prelo.receive({ type: 'classes', items: ['demo.Dados.Venda', 'demo.Dados.Pedido', 'demo.Dados.Cliente'] });
    if (msg.type === 'importFields') {
      window.prelo.receive({ type: 'fields', className: msg.className, fields: [
        { name: 'regiao', type: 'string' }, { name: 'vendedor', type: 'string' },
        { name: 'cliente', type: 'object', fields: [ { name: 'nome', type: 'string' }, { name: 'cnpj', type: 'string' } ] },
        { name: 'data', type: 'date' }, { name: 'quantidade', type: 'integer' }, { name: 'valor', type: 'money' },
        { name: 'itens', type: 'list', fields: [ { name: 'produto', type: 'string' }, { name: 'qtd', type: 'integer' } ] } ] });
    }
    if (msg.type === 'change') {
      // simula o aviso de campo inexistente do plugin
      const m = JSON.parse(msg.json);
      const items = [];
      (m.body || []).forEach((el, i) => { if (el.type === 'text' && /\$\{vlor\}/.test(el.value || '')) items.push({ path: ['body', i, 'value'], message: "campo 'vlor' não existe (disponíveis: valor, ...)" }); });
      window.prelo.receive({ type: 'problems', items });
    }
  };
</script>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <span class="title" id="title">Prelo</span>
    <div class="grp">
      <button class="tbtn icon" id="undo" title="Desfazer (Ctrl+Z)"><i data-icon="undo"></i></button>
      <button class="tbtn icon" id="redo" title="Refazer (Ctrl+Y)"><i data-icon="redo"></i></button>
    </div>
    <span class="spacer"></span>
    <span class="status" id="status"></span>
    <div class="grp">
      <button class="tbtn icon" id="zoomOut" title="Diminuir"><i data-icon="zoomOut"></i></button>
      <button class="tbtn zoom" id="zoomFit" title="Ajustar à largura"><span id="zoomLabel">100%</span></button>
      <button class="tbtn icon" id="zoomIn" title="Aumentar"><i data-icon="zoomIn"></i></button>
    </div>
    <span class="vsep"></span>
    <button class="tbtn" id="reportProps" title="Página, parâmetros e campos do relatório"><i data-icon="settings"></i>Relatório</button>
    <button class="tbtn icon" id="pasteBtn" title="Colar blocos (Ctrl+V)"><i data-icon="paste"></i></button>
    <span class="vsep"></span>
    <div class="seg">
      <button class="tbtn" id="splitPreview" title="Layout e PDF lado a lado, atualizando sozinho"><i data-icon="split"></i>Lado a lado</button>
      <button class="tbtn" id="togglePreview" title="Ver o PDF gerado com os dados de exemplo"><i data-icon="eye"></i>PDF</button>
    </div>
  </div>
  <div id="palette"></div>
  <div id="center">
    <div id="canvas"></div>
    <div id="preview"></div>
    <div id="banner"><div class="box" id="bannerText"></div></div>
  </div>
  <div id="props"></div>
</div>
<script src="../prelo-intellij/src/main/resources/designer/designer.js"></script>
</body>
</html>
