name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build e testes (bibliotecas e servidor)
        run: ./gradlew build -x :prelo-intellij:build --console=plain
      - name: Plugin IntelliJ (baixa a IDE de ideaVersion)
        run: ./gradlew :prelo-intellij:buildPlugin :prelo-intellij:verifyPluginStructure --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: prelo-intellij/build/distributions/*.zip
