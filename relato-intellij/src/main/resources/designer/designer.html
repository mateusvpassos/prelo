<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Relato Designer</title>
<link rel="stylesheet" href="designer.css">
<script src="icons.js"></script>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <span class="title" id="title">Relato</span>
    <div class="grp">
      <button class="tbtn icon" id="undo" title="Desfazer (Ctrl+Z)"><i data-icon="undo"></i></button>
      <button class="tbtn icon" id="redo" title="Refazer (Ctrl+Y)"><i data-icon="redo"></i></button>
    </div>
    <span class="spacer"></span>
    <span class="status" id="status"></span>
    <div class="grp">
      <button class="tbtn icon" id="zoomOut" title="Diminuir"><i data-icon="zoomOut"></i></button>
      <button class="tbtn zoom" id="zoomFit" title="Ajustar à largura"><span id="zoomLabel">100%</span></button>
      <button class="tbtn icon" id="zoomIn" title="Aumentar"><i data-icon="zoomIn"></i></button>
    </div>
    <span class="vsep"></span>
    <button class="tbtn" id="reportProps" title="Página, parâmetros e campos do relatório"><i data-icon="settings"></i>Relatório</button>
    <button class="tbtn icon" id="pasteBtn" title="Colar blocos (Ctrl+V)"><i data-icon="paste"></i></button>
    <span class="vsep"></span>
    <div class="seg">
      <button class="tbtn" id="splitPreview" title="Layout e PDF lado a lado, atualizando sozinho"><i data-icon="split"></i>Lado a lado</button>
      <button class="tbtn" id="togglePreview" title="Ver o PDF gerado com os dados de exemplo"><i data-icon="eye"></i>PDF</button>
    </div>
  </div>
  <div id="palette"></div>
  <div id="center">
    <div id="canvas"></div>
    <div id="preview"></div>
    <div id="banner"><div class="box" id="bannerText"></div></div>
  </div>
  <div id="props"></div>
</div>
<script src="designer.js"></script>
</body>
</html>
